services:
  digiportal-xpra:
    container_name: digipanel-xpra
    image: hammusings/digipanel-xpra:latest
    ports:
      - 7300:8080
    devices:
      - /dev/snd:/dev/snd
      - /dev/dri:/dev/dri
    networks:
      - browsershack-backend
    environment:
      - LIBVA_DRIVER_NAME=iHD
      - WEBKIT_DISABLE_COMPOSITING_MODE=1
    restart: unless-stopped
    group_add:
      - video
      - render
      - "991"
networks:
  browsershack-backend:
    external: true
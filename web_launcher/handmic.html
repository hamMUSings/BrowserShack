   <script>
        // Create a WebSocket instance and connect to the server
        const socket = new WebSocket('ws://HHOOSSTTPPLLAACCEEHHOOLLDDEEERR:12020');

        // Event listener for when the WebSocket connection is opened
        socket.onopen = function (event) {
            // Alert the user that they are connected to the WebSocket server
            alert('You are Connected to Hamlib Server');
        };

        // Event listener for when the WebSocket connection is closed
        socket.onclose = function (event) {
            // Log a message when disconnected

            console.log('Disconnected from Hamlib server');
        };

		// Functions to send a message to the Hamlib WebSocket server
        function sendUSB() {
            socket.send('hamlib -s HHOOSSTTPPLLAACCEEHHOOLLDDEEERR -p 4534 -a M -d USB');
        }
		
        function sendLSB() {
            socket.send('hamlib -s HHOOSSTTPPLLAACCEEHHOOLLDDEEERR -p 4534 -a M -d LSB');
        }
		
        function sendFM() {
            socket.send('hamlib -s HHOOSSTTPPLLAACCEEHHOOLLDDEEERR -p 4534 -a M -d FM');
        }
		
        function sendFreq() {

        function sendPTT_ON() {
            socket.send('hamlib -s HHOOSSTTPPLLAACCEEHHOOLLDDEEERR -p 4534 -a T -d 1');

		function sendPTT_OFF() {
            socket.send('hamlib -s HHOOSSTTPPLLAACCEEHHOOLLDDEEERR -p 4534 -a T -d 0');
        }

            socket.send('hamlib -s HHOOSSTTPPLLAACCEEHHOOLLDDEEERR -p 4534 -a T -d 0');
        }
